services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vaievolta}
      POSTGRES_USER: ${POSTGRES_USER:-vaievolta}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no arquivo .env}
      TZ: ${TZ:-America/Sao_Paulo}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vaievolta} -d ${POSTGRES_DB:-vaievolta}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-vaievolta}:${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no arquivo .env}@db:5432/${POSTGRES_DB:-vaievolta}
      APP_ENV: ${APP_ENV:-dev}
      JWT_SECRET: ${JWT_SECRET:?Defina JWT_SECRET no arquivo .env}
      JWT_EXPIRES_DAYS: ${JWT_EXPIRES_DAYS:-15}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      LOGIN_MAX_ATTEMPTS: ${LOGIN_MAX_ATTEMPTS:-5}
      LOGIN_WINDOW_MINUTES: ${LOGIN_WINDOW_MINUTES:-15}
      LOGIN_LOCK_MINUTES: ${LOGIN_LOCK_MINUTES:-15}
      PROPOSAL_TTL_HOURS: ${PROPOSAL_TTL_HOURS:-48}
      ACCOUNT_RETENTION_DAYS: ${ACCOUNT_RETENTION_DAYS:-365}
      UPLOAD_DIR: ${UPLOAD_DIR:-/data/uploads}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-5}
      MAX_PHOTOS: ${MAX_PHOTOS:-5}
      TZ: ${TZ:-America/Sao_Paulo}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/openapi.json', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

    volumes:
      - uploads:${UPLOAD_DIR:-/data/uploads}

  web:
    build:
      context: ./frontend
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:80"
    volumes:
      - uploads:/data/uploads:ro
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  worker:
    # Mesma imagem do backend, outro comando (Doc. Técnico 7.3). As migrações são aplicadas
    # pelo backend; por isso o worker só sobe depois que a API estiver saudável.
    build:
      context: ./backend
    command: ["python", "-m", "app.worker"]
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-vaievolta}:${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no arquivo .env}@db:5432/${POSTGRES_DB:-vaievolta}
      APP_ENV: ${APP_ENV:-dev}
      PROPOSAL_TTL_HOURS: ${PROPOSAL_TTL_HOURS:-48}
      ACCOUNT_RETENTION_DAYS: ${ACCOUNT_RETENTION_DAYS:-365}
      UPLOAD_DIR: ${UPLOAD_DIR:-/data/uploads}
      TZ: ${TZ:-America/Sao_Paulo}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - uploads:${UPLOAD_DIR:-/data/uploads}
    depends_on:
      db:
        condition: service_healthy
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-m", "app.worker.healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped

volumes:
  postgres_data:
  uploads:
